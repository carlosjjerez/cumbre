<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Cumbre — tus objetivos, paso a paso</title>
  <meta name="description" content="Apunta tus objetivos como montañas y sube un escalón cada día. Racha, progreso y tu porqué siempre presentes.">

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#d85a30">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cumbre">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <main id="view"></main>

    <button id="fab" class="fab hidden" data-act="nav" data-route="nueva" aria-label="Nueva montaña">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>

    <nav id="tabbar" class="tabbar hidden">
      <button class="tab" data-act="nav" data-route="hoy">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M3 12h1M20 12h1M12 3v1M12 20v1M5.6 5.6l.7 .7M17.7 17.7l.7 .7M18.4 5.6l-.7 .7M6.3 17.7l-.7 .7"/></svg>
        <span>Hoy</span>
      </button>
      <button class="tab" data-act="nav" data-route="montanas">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20l7 -12l4 7l2 -3l5 8z"/></svg>
        <span>Montañas</span>
      </button>
      <button class="tab" data-act="nav" data-route="progreso">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16h16"/><path d="M8 15l3 -4l3 2l4 -6"/></svg>
        <span>Progreso</span>
      </button>
    </nav>
  </div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
